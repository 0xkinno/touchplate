packages:
  - "spikes"
  - "packages/*"
  - "apps/*"
  - "verifier"
  - "bench"
  - "drills"
  - "indexer"
allowBuilds:
  '@reown/appkit': true
  bufferutil: set this to true or false
  esbuild: true
  keccak: set this to true or false
  utf-8-validate: set this to true or false

overrides:
  "@wagmi/connectors": "6.2.0"
  "@wagmi/core": "2.22.1"
  "wagmi": "2.19.5"
